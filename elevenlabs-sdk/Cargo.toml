[package]
name = "elevenlabs_sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for elevenlabs_sdk generated by Fern"
license = "MIT"
repository = "https://github.com/fern-api/fern"
documentation = "https://docs.rs/elevenlabs_sdk"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
pin-project = { version = "1.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
reqwest-sse = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["multipart", "sse"]
multipart = ["reqwest/multipart"]
sse = ["reqwest-sse", "pin-project"]

[dependencies.elevenlabs_types]
path = "../elevenlabs-types"
