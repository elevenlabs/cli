name: ci

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTFLAGS: "-A warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: 11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: 166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Check
        run: cargo check

  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: 11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: 166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Compile
        run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: 11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: 166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Test
        run: cargo test

