name: windows-smoke

# Runs `onboard` on Windows the way the ElevenLabs Home prompt has a coding
# agent run it: `onboard init`, then each reply's `run`, in Git Bash as Claude
# Code does, reading each reply through a pipe. On a pull request it runs the
# CLI built from the PR; run by hand, the published one through npx.
#
# No one is there to sign in, so it goes as far as a machine can alone: the
# sign-in starts in the background and hands back the approval link. It then
# answers the way the approval page does when the developer clicks Deny, which
# shows the sign-in outlived the command that started it and that the
# browser's callback reaches it, even with another program on one loopback
# address of the first callback port.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - cli/elevenlabs/workflow/onboard/**
      - cli/elevenlabs/workflow/loopback.rs
      - cli/elevenlabs/workflow/setup.rs
      - cli/elevenlabs/workflow/setup/**
      - .github/workflows/windows-smoke.yml

jobs:
  onboard:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6

      - name: Cache cargo registry and build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-smoke-

      - name: Build the CLI
        if: github.event_name == 'pull_request'
        run: |
          cargo build --bin elevenlabs
          cygpath -w "$PWD/target/debug" >> "$GITHUB_PATH"

      # npm installs agents as .cmd shims, often under a user folder such as
      # `C:\Users\Ann (Work)`, whose parentheses break a hand-built `cmd /C`.
      - name: Set up coding agents installed in a folder with parentheses
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_path="$PATH"
          bin="$(mktemp -d)/agents (test) dir"
          mkdir -p "$bin"
          # Stand-ins for `claude` and `codex` that log their arguments, one
          # line per run; the claude in $failing refuses `plugin install`.
          stand_in() {
            cat > "$1/$2.cmd" <<EOF
          @echo off
          echo %*>>"$(cygpath -w "$1/$2.log")"
          $3
          exit /b 0
          EOF
          }
          stand_in "$bin" claude ""
          stand_in "$bin" codex ""
          failing="$(mktemp -d)/failing agent"
          mkdir -p "$failing"
          stand_in "$failing" claude 'echo %* | findstr /C:"plugin install" >nul && (>&2 echo install refused& exit /b 1)'
          for var in USERPROFILE HOME CLAUDE_CONFIG_DIR CODEX_HOME; do
            export "$var=$(cygpath -w "$(mktemp -d)")"
          done
          unset CLAUDE_CODE_EXECPATH
          # Quotes std may add around an argument, and cmd's line endings, aside.
          ran() { tr -d '"\r' < "$1" 2>/dev/null || true; }
          expect() {
            if [[ "$(ran "$1")" != "$2" ]]; then
              echo "::error::$3, got:"
              ran "$1"
              exit 1
            fi
          }

          export PATH="$bin:$base_path"
          elevenlabs setup
          expect "$bin/claude.log" "" "setup without --yes ran a Claude Code command"
          expect "$bin/codex.log" "" "setup without --yes ran a Codex command"

          elevenlabs setup --yes
          expect "$bin/claude.log" "$(printf '%s\n' \
            "plugin marketplace update elevenlabs" \
            "plugin install elevenlabs --marketplace elevenlabs/plugin --scope user" \
            "plugin update elevenlabs@elevenlabs")" "Expected the three Claude Code commands"
          expect "$bin/codex.log" "$(printf '%s\n' \
            "plugin marketplace add elevenlabs/plugin" \
            "plugin marketplace upgrade elevenlabs" \
            "plugin add elevenlabs@elevenlabs")" "Expected the three Codex commands"

          export PATH="$failing:$base_path"
          code=0
          out=$(elevenlabs setup --yes) || code=$?
          echo "$out"
          if [[ "$code" != 1 ]]; then
            echo "::error::setup --yes with a failing install exited with $code, not 1"
            exit 1
          fi
          refused='Claude Code: failed: `claude plugin install elevenlabs --marketplace elevenlabs/plugin --scope user` exited with 1: install refused'
          if [[ "$out" != *"$refused"* ]]; then
            echo "::error::setup --yes didn't show the install's error"
            exit 1
          fi
          expect "$failing/claude.log" "$(printf '%s\n' \
            "plugin marketplace update elevenlabs" \
            "plugin install elevenlabs --marketplace elevenlabs/plugin --scope user")" \
            "Expected Claude Code to stop at the failed install"

      # PowerShell and cmd pass the search path as `Path`; Git Bash passes `PATH`.
      - name: Set up coding agents from PowerShell
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function New-TempFolder {
            New-Item -ItemType Directory (Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid()))
          }
          # A stand-in that logs its arguments, one line per run, and runs $also first.
          function New-StandIn($folder, $name, $also) {
            Set-Content -Encoding ascii -Path (Join-Path $folder "$name.cmd") -Value @(
              '@echo off'
              "echo %*>>`"$(Join-Path $folder "$name.log")`""
              $also
              'exit /b 0'
            )
          }
          # What a stand-in ran, quotes std may add around an argument aside.
          function Get-Ran($folder, $name) {
            $log = Join-Path $folder "$name.log"
            if (-not (Test-Path $log)) { return '' }
            @(Get-Content $log | ForEach-Object { $_.Replace('"', '').Trim() }) -join "`n"
          }
          function Assert-Ran($folder, $name, $expected, $what) {
            $ran = Get-Ran $folder $name
            if ($ran -cne ($expected -join "`n")) {
              Write-Host "::error::$what, got:"
              Write-Host $ran
              exit 1
            }
          }
          $bin = (New-TempFolder).FullName
          New-StandIn $bin 'claude' ''
          New-StandIn $bin 'codex' ''
          $failing = (New-TempFolder).FullName
          New-StandIn $failing 'claude' 'echo %* | findstr /C:"plugin install" >nul && (>&2 echo install refused& exit /b 1)'
          $basePath = $env:Path
          # Spelled `Path` whatever the runner passed.
          function Set-SearchPath($first) {
            Remove-Item env:Path
            [Environment]::SetEnvironmentVariable('Path', "$first;$basePath")
          }
          foreach ($var in 'USERPROFILE', 'HOME', 'CLAUDE_CONFIG_DIR', 'CODEX_HOME') {
            Set-Item "env:$var" (New-TempFolder).FullName
          }
          Remove-Item env:CLAUDE_CODE_EXECPATH -ErrorAction SilentlyContinue
          Set-SearchPath $bin
          $name = [Environment]::GetEnvironmentVariables().Keys | Where-Object { $_ -ieq 'path' }
          Write-Host "The search path variable is spelled: $name"
          if ($name -cne 'Path') { throw "Expected the search path variable spelled Path, got $name" }

          elevenlabs setup
          if ($LASTEXITCODE -ne 0) { throw "setup exited with $LASTEXITCODE" }
          Assert-Ran $bin 'claude' @() 'setup without --yes ran a Claude Code command'
          Assert-Ran $bin 'codex' @() 'setup without --yes ran a Codex command'

          elevenlabs setup --yes
          if ($LASTEXITCODE -ne 0) { throw "setup --yes exited with $LASTEXITCODE" }
          Assert-Ran $bin 'claude' @(
            'plugin marketplace update elevenlabs'
            'plugin install elevenlabs --marketplace elevenlabs/plugin --scope user'
            'plugin update elevenlabs@elevenlabs'
          ) 'Expected the three Claude Code commands'
          Assert-Ran $bin 'codex' @(
            'plugin marketplace add elevenlabs/plugin'
            'plugin marketplace upgrade elevenlabs'
            'plugin add elevenlabs@elevenlabs'
          ) 'Expected the three Codex commands'

          Set-SearchPath $failing
          $out = (elevenlabs setup --yes) -join "`n"
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 1) { throw "setup --yes with a failing install exited with $code, not 1" }
          $refused = 'Claude Code: failed: `claude plugin install elevenlabs --marketplace elevenlabs/plugin --scope user` exited with 1: install refused'
          if (-not $out.Contains($refused)) { throw "setup --yes didn't show the install's error" }
          Assert-Ran $failing 'claude' @(
            'plugin marketplace update elevenlabs'
            'plugin install elevenlabs --marketplace elevenlabs/plugin --scope user'
          ) 'Expected Claude Code to stop at the failed install'
          # The failed setup above exited 1 on purpose, and pwsh would end the step with it.
          exit 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"

      - name: Onboard up to the approval page
        env:
          CLI: ${{ github.event_name == 'pull_request' && 'elevenlabs' || 'npx -y @elevenlabs/cli@latest' }}
        run: |
          set -euo pipefail
          out=$(mktemp)
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          $CLI --version

          # Run a command as an agent would, reading its reply (one line of
          # JSON) through a pipe, and stop unless the reply comes back in time
          # with the `next` expected.
          step() {
            echo "+ $1"
            if ! timeout 90 bash -o pipefail -c "$1 | tail -n 1 > '$out'"; then
              echo "::error::No reply within 90 s: the command failed, or something it started kept its output open"
              exit 1
            fi
            reply=$(< "$out")
            echo "$reply"
            local next
            next=$(jq -r .next <<< "$reply")
            if [[ "$next" != "$2" ]]; then
              echo "::error::Expected next=$2, got next=$next"
              exit 1
            fi
          }

          # Another program on one loopback address of the first callback
          # port. Browsers dial [::1] first for `localhost`, so a sign-in that
          # left [::1]:8484 to it would never get the callback.
          node -e "require('http').createServer((q, s) => s.end('another program')).listen(8484, '::1')" > /dev/null 2>&1 &
          for _ in $(seq 1 50); do
            [[ "$(curl -sg http://[::1]:8484/ || true)" == "another program" ]] && break
            sleep 0.2
          done
          if [[ "$(curl -sg http://[::1]:8484/ || true)" != "another program" ]]; then
            echo "::error::The other program didn't start on [::1]:8484"
            exit 1
          fi

          step "$CLI onboard init" run
          # Starts the sign-in, waits for an approval that never comes, then says to keep waiting.
          step "$(jq -r .run <<< "$reply")" wait

          url=$(jq -r .say <<< "$reply" | grep -o 'https://[^ ]*')
          if [[ "$url" != https://elevenlabs.io/app/oauth/authorize\?*key_handoff=clipboard* ]]; then
            echo "::error::Unexpected approval link: $url"
            exit 1
          fi

          # What the approval page does when the developer clicks Deny.
          callback=$(node -p 'new URL(process.argv[1]).searchParams.get("redirect_uri")' "$url")
          if [[ "$callback" != "http://localhost:8483/callback" ]]; then
            echo "::error::The sign-in should have moved off 8484, it listens at $callback"
            exit 1
          fi
          state=$(node -p 'new URL(process.argv[1]).searchParams.get("state")' "$url")
          curl -sS -o /dev/null -w "Callback answered %{http_code}\n" "$callback?error=access_denied&state=$state"

          step "$(jq -r .run <<< "$reply")" ask_user
          if ! jq -e '.say | contains("declined")' <<< "$reply" > /dev/null; then
            echo "::error::The sign-in didn't report the Deny"
            exit 1
          fi

      - name: Show the sign-in log
        if: failure()
        run: cat ~/.elevenlabs/onboard/*/worker.log || true
