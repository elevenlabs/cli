name: windows-smoke

# Runs the published CLI on Windows the way the ElevenLabs Home prompt has a
# coding agent run it: `npx -y @elevenlabs/cli@latest onboard init`, then each
# reply's `run`, in Git Bash as Claude Code does. No one is there to sign in,
# so it goes as far as a machine can alone: the sign-in starts in the
# background and hands back the approval link. It then answers the way the
# approval page does when the developer clicks Deny, which shows the sign-in
# outlived the command that started it and that the browser's callback
# reaches it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-smoke.yml

jobs:
  onboard:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"

      - name: Onboard up to the approval page
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npx -y @elevenlabs/cli@latest --version

          # Run a command as an agent would, keep its reply (one line of JSON),
          # and stop unless the reply's `next` is the one expected.
          step() {
            echo "+ $1"
            reply=$(eval "$1" | tail -n 1)
            echo "$reply"
            local next
            next=$(jq -r .next <<< "$reply")
            if [[ "$next" != "$2" ]]; then
              echo "::error::Expected next=$2, got next=$next"
              exit 1
            fi
          }

          step "npx -y @elevenlabs/cli@latest onboard init" run
          # Starts the sign-in, waits for an approval that never comes, then says to keep waiting.
          step "$(jq -r .run <<< "$reply")" wait

          url=$(jq -r .say <<< "$reply" | grep -o 'https://[^ ]*')
          if [[ "$url" != https://elevenlabs.io/app/oauth/authorize\?*key_handoff=clipboard* ]]; then
            echo "::error::Unexpected approval link: $url"
            exit 1
          fi

          # What the approval page does when the developer clicks Deny.
          callback=$(node -p 'new URL(process.argv[1]).searchParams.get("redirect_uri")' "$url")
          curl -sS -o /dev/null -w "Callback answered %{http_code}\n" "$callback?error=access_denied"

          step "$(jq -r .run <<< "$reply")" ask_user
          if ! jq -e '.say | contains("declined")' <<< "$reply" > /dev/null; then
            echo "::error::The sign-in didn't report the Deny"
            exit 1
          fi

      - name: Show the sign-in log
        if: failure()
        run: cat ~/.elevenlabs/onboard/*/worker.log || true
