name: windows-smoke

# Runs the published CLI on Windows the way the ElevenLabs Home prompt has a
# coding agent run it: `npx -y @elevenlabs/cli@latest onboard init`, then each
# reply's `run`, in Git Bash as Claude Code does. No one is there to sign in,
# so it goes as far as a machine can alone: the sign-in starts in the
# background and hands back the approval link. It then answers the way the
# approval page does when the developer clicks Deny, which shows the sign-in
# outlived the command that started it and that the browser's callback
# reaches it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-smoke.yml

jobs:
  onboard:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"

      - name: Diagnose connect (temporary)
        run: |
          set -uo pipefail
          procs() { tasklist | grep -i -E "elevenlabs|node|msedge|chrome" || true; }
          for mode in browser no-browser; do
            echo "=== $mode ==="
            cd "$(mktemp -d)"
            npm init -y > /dev/null
            flag=""; [[ $mode == no-browser ]] && flag=" --no-browser"
            npx -y @elevenlabs/cli@latest onboard init$flag 2> init.err | tail -n 1 > init.json
            run=$(jq -r .run init.json)
            echo "+ $run"
            start=$SECONDS
            # Output to files: the shell waits only for the command itself.
            timeout 120 bash -c "$run" > connect.json 2> connect.err
            echo "to a file: exit=$? after $((SECONDS - start))s"
            cut -c1-200 connect.json; cat connect.err
            procs
            echo "--- worker.log"; cat ~/.elevenlabs/onboard/*/worker.log 2>/dev/null | cut -c1-200
            # Through a pipe, as an agent reads it.
            run=$(jq -r .run connect.json)
            echo "+ $run | tail -n 1"
            start=$SECONDS
            timeout 90 bash -c "$run 2> wait.err | tail -n 1 > wait.json"
            echo "through a pipe: exit=$? after $((SECONDS - start))s"
            cut -c1-200 wait.json
            procs
            taskkill //F //IM elevenlabs.exe > /dev/null 2>&1 || true
          done
