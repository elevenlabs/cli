name: windows-smoke

# Runs `onboard` on Windows the way the ElevenLabs Home prompt has a coding
# agent run it: `onboard init`, in Git Bash as Claude Code does, reading its
# reply through a pipe. On a pull request it runs the CLI built from the PR;
# run by hand, the published one through npx.
#
# No one is there to sign in, so it goes as far as a machine can alone: `init`
# starts the sign-in `auth login` runs and prints its approval link. It then
# answers the way the approval page does when the developer clicks Deny, which
# shows the browser's callback reaches the sign-in and the command ends on a
# reply.
#
# It also hands an agent the ElevenLabs skills the two ways the CLI does: the
# command `onboard`'s hand-over names, run as printed in Git Bash and in
# PowerShell, and `migrate openai`, which copies them itself.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - cli/elevenlabs/workflow/onboard/**
      - cli/elevenlabs/workflow/skills_copy.rs
      - cli/elevenlabs/workflow/migrate.rs
      - .github/workflows/windows-smoke.yml

jobs:
  onboard:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6

      - name: Cache cargo registry and build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-smoke-

      - name: Build the CLI
        if: github.event_name == 'pull_request'
        run: |
          cargo build --bin elevenlabs
          cygpath -w "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"

      - name: Onboard up to the approval page
        env:
          CLI: ${{ github.event_name == 'pull_request' && 'elevenlabs' || 'npx -y @elevenlabs/cli@latest' }}
        run: |
          set -euo pipefail
          out=$(mktemp)
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          $CLI --version

          # `init` is the sign-in: it waits for the approval in the foreground,
          # as `auth login` does, with the link on stderr.
          log="$RUNNER_TEMP/onboard-stderr.log"
          $CLI onboard init --no-browser > "$out" 2> "$log" &
          pid=$!
          url=""
          for _ in $(seq 1 300); do
            url=$(grep -o 'URL: https://[^ ]*' "$log" | head -n 1 | cut -c6- || true)
            [[ -n "$url" ]] && break
            sleep 0.2
          done
          cat "$log"
          if [[ "$url" != https://elevenlabs.io/app/oauth/authorize\?*key_handoff=clipboard* ]]; then
            echo "::error::Unexpected approval link: $url"
            exit 1
          fi

          # What the approval page does when the developer clicks Deny.
          callback=$(node -p 'new URL(process.argv[1]).searchParams.get("redirect_uri")' "$url")
          state=$(node -p 'new URL(process.argv[1]).searchParams.get("state")' "$url")
          curl -sS -o /dev/null -w "Callback answered %{http_code}\n" "$callback?error=access_denied&state=$state"

          # The command ends on its reply: one line of JSON, read as an agent reads it.
          for _ in $(seq 1 450); do
            kill -0 "$pid" 2> /dev/null || break
            sleep 0.2
          done
          if kill -0 "$pid" 2> /dev/null; then
            echo "::error::No reply within 90 s of the Deny: the command kept waiting, or something it started kept it open"
            exit 1
          fi
          reply=$(tail -n 1 "$out")
          echo "$reply"
          next=$(jq -r .next <<< "$reply")
          if [[ "$next" != "ask_user" ]]; then
            echo "::error::Expected next=ask_user, got next=$next"
            exit 1
          fi
          if ! jq -e '.say | contains("declined")' <<< "$reply" > /dev/null; then
            echo "::error::The sign-in didn't report the Deny"
            exit 1
          fi

      - name: Show the sign-in's output
        if: failure()
        run: cat "$RUNNER_TEMP/onboard-stderr.log" || true

      - name: Hand over the skills in Git Bash and PowerShell
        env:
          CLI: ${{ github.event_name == 'pull_request' && 'elevenlabs' || 'npx -y @elevenlabs/cli@latest' }}
          API: http://127.0.0.1:8765
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"

          # A stand-in for ElevenLabs that accepts any key, so `init` reaches its
          # hand-over, and that serves a skills download holding a migration guide.
          mkdir -p repo/skills-main/migrate-from-openai
          echo "# Migrate from OpenAI" > repo/skills-main/migrate-from-openai/SKILL.md
          tar -czf skills.tar.gz -C repo skills-main
          cat > server.js << 'EOF'
          const http = require("http");
          const fs = require("fs");
          http
            .createServer((req, res) => {
              if (req.url === "/skills.tar.gz") return res.end(fs.readFileSync("skills.tar.gz"));
              res.setHeader("content-type", "application/json");
              res.end(JSON.stringify({ user_id: "smoke" }));
            })
            .listen(8765, "127.0.0.1");
          EOF
          node server.js &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null "$API/v1/user" && break
            sleep 0.2
          done

          mkdir project
          cd project
          npm init -y > /dev/null
          echo "ELEVENLABS_API_KEY=sk_0123456789abcdef0123456789abcdef01234567" > .env

          # Git Bash: the hand-over's own command, as printed, with GitHub's real download.
          reply=$($CLI --base-url "$API" onboard init)
          fetch=$(jq -r .details.fetch_skills <<< "$reply")
          dir=$(jq -r .details.skills_dir <<< "$reply")
          echo "$fetch"
          names=$(eval "$fetch")
          echo "$names"
          if ! grep -qx "text-to-speech" <<< "$names" || [[ ! -f "$(cygpath -u "$dir")/text-to-speech/SKILL.md" ]]; then
            echo "::error::Git Bash: the skills aren't in $dir"
            exit 1
          fi

          # PowerShell: the same, from a reply of its own.
          cat > skills.ps1 << 'EOF'
          $ErrorActionPreference = "Stop"
          $reply = Invoke-Expression "$env:CLI --base-url $env:API onboard init" | ConvertFrom-Json
          Write-Host $reply.details.fetch_skills
          Invoke-Expression $reply.details.fetch_skills
          if ($LASTEXITCODE -ne 0) { throw "PowerShell: the skills command failed" }
          $guide = Join-Path $reply.details.skills_dir "text-to-speech\SKILL.md"
          if (-not (Test-Path $guide)) { throw "PowerShell: no skill at $guide" }
          EOF
          pwsh -NoProfile -File skills.ps1

          # `migrate openai` copies the skills itself and names the guide.
          reply=$(ELEVENLABS_SKILLS_ARCHIVE="$API/skills.tar.gz" $CLI migrate openai)
          echo "$reply"
          guide=$(jq -r .details.guide <<< "$reply")
          if [[ "$(jq -r .next <<< "$reply")" != "follow_guide" ]] || ! grep -q "Migrate from OpenAI" "$(cygpath -u "$guide")"; then
            echo "::error::migrate openai didn't hand over its guide"
            exit 1
          fi
          left=$(ls -A | grep -vx -e .env -e .gitignore -e package.json -e skills.ps1 || true)
          if [[ -n "$left" ]]; then
            echo "::error::Something was left in the project: $left"
            exit 1
          fi
