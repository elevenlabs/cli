name: ci

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTFLAGS: "-A warnings"

# NOTE: this org restricts GitHub Actions to an allowlist (github-owned plus
# specific patterns), so third-party setup actions such as
# actions-rust-lang/setup-rust-toolchain cannot be used here — referencing one
# fails the whole run at startup. The GitHub-hosted ubuntu runners already ship
# a stable Rust toolchain, so we use that directly.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Check
        run: cargo check

  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Compile
        run: cargo build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Rust version
        run: rustc --version && cargo --version

      - name: Test
        run: cargo test

      # elevenlabs-sdk and elevenlabs-types are path dependencies, not members
      # of the cargo workspace, so `cargo test` above skips them. Run their
      # suites explicitly so the generated serialization tests are covered.
      - name: Test generated SDK crate
        run: cargo test --manifest-path elevenlabs-sdk/Cargo.toml

      - name: Test generated types crate
        run: cargo test --manifest-path elevenlabs-types/Cargo.toml
