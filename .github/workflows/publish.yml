name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g., 0.3.1)'
        required: true
        type: string
      publish_tag:
        description: 'npm publish tag'
        required: true
        type: choice
        options:
          - latest
          - beta
        default: latest

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Determine publish tag
        id: extract
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if [ -n "$INPUT_PUBLISH_TAG" ]; then
            PUBLISH_TAG="$INPUT_PUBLISH_TAG"
          else
            FULL_TAG_NAME="$RELEASE_TAG"
            if [[ "$FULL_TAG_NAME" == *"beta"* ]]; then
              PUBLISH_TAG="beta"
            else
              PUBLISH_TAG="latest"
            fi
          fi
          echo "PUBLISH_TAG=$PUBLISH_TAG" >> "$GITHUB_ENV"

      - name: Validate tag matches package.json version
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG_VERSION="$RAW_TAG"
          # Remove package name prefix if present (e.g., @elevenlabs/cli@0.3.1 -> 0.3.1)
          TAG_VERSION="${TAG_VERSION##*@}"
          PACKAGE_JSON_VERSION=$(node -p "require('./package.json').version")

          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PACKAGE_JSON_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_JSON_VERSION" ]; then
            echo "ERROR: Version mismatch!"
            echo "Git tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_JSON_VERSION)"
            echo "Please ensure the git tag matches the version in package.json"
            exit 1
          fi

          echo "Version check passed: $TAG_VERSION"

      - name: Print publish tag
        run: |
          echo "Publish tag is $PUBLISH_TAG"

      - name: Publish package
        run: |
          # Configure pnpm to use local npm v11.6.4 for OIDC support
          NPM_BIN="$PWD/node_modules/.bin/npm"
          pnpm config set npm-path "$NPM_BIN"
          # Use pnpm publish with --provenance for OIDC authentication
          pnpm publish --access public --no-git-checks --tag $PUBLISH_TAG --provenance
