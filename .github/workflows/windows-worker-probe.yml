name: windows-worker-probe

# Temporary: on Windows, does onboard's background sign-in worker or a
# foreground sign-in (`auth login`) still answer the browser's callback when
# an agent runs and ends the command the way agents do? Runs only on pushes
# to the probe branch, against the published CLI and the one built from
# this branch. Not for merging.
on:
  push:
    branches: [paul/windows-worker-vs-foreground-probe-2]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/Krypton"

      - name: Install the published CLI
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cli-published" --no-save @elevenlabs/cli-win32-x64@1.12.0 > /dev/null
          exe=$(find "$RUNNER_TEMP/cli-published/node_modules/@elevenlabs" -name 'elevenlabs.exe' | head -n 1)
          echo "PUBLISHED_CLI=$(cygpath -w "$exe")" >> "$GITHUB_ENV"
          "$exe" --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-smoke-

      - name: Build this branch's CLI
        run: |
          cargo build --bin elevenlabs
          echo "BRANCH_CLI=$(cygpath -w "$PWD/target/debug/elevenlabs.exe")" >> "$GITHUB_ENV"

      - name: Probe worker and foreground sign-ins
        run: python .github/worker-probe/probe.py "$BRANCH_CLI" "$PUBLISHED_CLI"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Onboard tests
        run: cargo test onboard
      - name: Formatting of the changed files
        run: rustfmt --check --edition 2021 cli/elevenlabs/workflow/onboard/connect.rs cli/elevenlabs/workflow/onboard/session.rs cli/elevenlabs/workflow/onboard/tests.rs
